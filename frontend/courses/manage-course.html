<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Course</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-back-btn"
        >
            ← Back to Dashboard
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1 id="courseTitle">
                Loading...
            </h1>

            <p id="courseDescription">
            </p>

        </div>


        <section class="card course-actions">

            <button
                type="button"
                id="editCourseBtn"
                class="btn btn-secondary"
            >
                Edit Course
            </button>

            <button
                type="button"
                id="addLessonBtn"
                class="btn btn-primary"
            >
                + Add Lesson
            </button>

            <button
                type="button"
                id="createQuizBtn"
                class="btn btn-primary"
            >
                + Create Quiz
            </button>

            <button
                type="button"
                id="viewStudentsBtn"
                class="btn btn-secondary"
            >
                View Students
            </button>

        </section>


        <section class="card">

            <h2>
                Lessons
            </h2>

            <div id="lessonList">
            </div>

        </section>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/manage-course.js"></script>

</body>

</html>
