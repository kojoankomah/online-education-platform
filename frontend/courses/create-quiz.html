<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Quiz</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/form.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            id="backToCourse"
            href="#"
            class="page-back-btn"
        >
            ← Back to Course
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1>
                Create Quiz
            </h1>

            <p>
                Create a quiz for one of the course lessons,
                then add questions to assess student understanding.
            </p>

        </div>


        <div class="card">

            <form id="quizForm">

                <div class="form-group">

                    <label for="lessonSelect">
                        Select Lesson
                    </label>

                    <select
                        id="lessonSelect"
                        required
                    >

                        <option value="">
                            Loading lessons...
                        </option>

                    </select>

                    <small>
                        Choose the lesson this quiz should assess.
                    </small>

                </div>


                <div class="form-group">

                    <label for="quizTitle">
                        Quiz Title
                    </label>

                    <input
                        type="text"
                        id="quizTitle"
                        required
                    >

                    <small>
                        Use a clear title that matches the lesson topic.
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Quiz
                </button>

            </form>

        </div>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/create-quiz.js"></script>

</body>

</html>
