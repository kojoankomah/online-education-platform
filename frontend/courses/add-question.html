<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Question</title>

<link rel="stylesheet"
href="../css/global.css">

</head>


<body>


<header class="dashboard-header">

    <h2>
        <a href="../dashboard/instructor-dashboard.html">
            EduPlatform
        </a>
    </h2>

    <a id="backToCourse" href="#">
        Back
    </a>

</header>


<main class="container">


<div class="card">


<h1>
Add Quiz Question
</h1>

<p id="questionCount">
    Questions Added: 0
</p>

<form id="questionForm">


<label>
Question
</label>

<textarea
id="question"
required>
</textarea>



<label>
Option A
</label>

<input
id="option_a"
required>



<label>
Option B
</label>

<input
id="option_b"
required>



<label>
Option C
</label>

<input
id="option_c"
required>



<label>
Option D
</label>

<input
id="option_d"
required>



<label>
Correct Answer
</label>

<select id="correct_answer">

<option value="A">
Option A
</option>

<option value="B">
Option B
</option>

<option value="C">
Option C
</option>

<option value="D">
Option D
</option>

</select>


<button type="submit" id="addQuestionBtn" class="btn btn-primary">
    + Add Question
</button>

<button type="button" id="finishQuizBtn" class="btn btn-secondary">
    Finish Quiz
</button>

</form>



</div>


</main>


<script src="../js/api.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/add-question.js"></script>


</body>

</html>
