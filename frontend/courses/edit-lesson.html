<!DOCTYPE html>
<html lang="en">


<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Edit Lesson</title>

<link
    rel="stylesheet"
    href="../css/global.css"
>

</head>


<body>


<header class="dashboard-header">

<h2>
    <a href="../dashboard/instructor-dashboard.html">
        EduPlatform
    </a>
</h2>


<a id="backToCourse" href="#">
    Back
</a>

</header>


<main class="container">


<div class="card">


<h1>Edit Lesson</h1>


<form id="lessonForm">


<label for="title">
    Lesson Title
</label>

<input
    type="text"
    id="title"
    required
>


<label for="content">
    Lesson Content (Optional)
</label>

<textarea
    id="content"
    rows="10"
></textarea>


<label for="lessonOrder">
    Lesson Order
</label>

<input
    type="number"
    id="lessonOrder"
    min="1"
    step="1"
    required
>


<button
    type="submit"
    class="btn btn-primary"
>
    Save Changes
</button>


</form>


</div>


</main>

<script src="../js/notifications.js"></script>

<script src="../js/api.js"></script>
<script src="../js/edit-lesson.js"></script>

</body>


</html>
