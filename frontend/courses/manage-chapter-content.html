<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Chapter Content</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            href="#"
            id="backToChaptersBtn"
            class="page-back-btn"
        >
            ← Back to Chapters
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1 id="chapterTitle">
                Loading chapter...
            </h1>

            <p>
                Add and manage the content blocks students
                will see in this chapter.
            </p>

        </div>


        <section class="card course-actions">

            <button
                type="button"
                id="addContentBtn"
                class="btn btn-primary"
            >
                + Add Content
            </button>

        </section>


        <section class="card">

            <h2>
                Chapter Content
            </h2>

            <div id="contentList">

                <p>
                    Loading content...
                </p>

            </div>

        </section>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/manage-chapter-content.js"></script>

</body>

</html>
