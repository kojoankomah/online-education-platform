<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Manage Chapter Content</title>

<link
    rel="stylesheet"
    href="../css/global.css"
>

<link
    rel="stylesheet"
    href="../css/dashboard.css"
>

</head>

<body>

<header class="dashboard-header">

    <h2>
        <a href="../dashboard/instructor-dashboard.html">
            EduPlatform
        </a>
    </h2>

    <a
        href="#"
        id="backToChaptersBtn"
    >
        Back to Chapters
    </a>

</header>


<main class="dashboard-container">

    <section class="welcome-card">

        <h1 id="chapterTitle">
            Loading chapter...
        </h1>

        <p>
            Add and manage the content blocks
            students will see in this chapter.
        </p>

    </section>


    <section class="card course-actions">

        <button
            type="button"
            id="addContentBtn"
            class="btn btn-primary"
        >
            + Add Content
        </button>

    </section>


    <section class="card">

        <h2>
            Chapter Content
        </h2>

        <div id="contentList">

            <p>
                Loading content...
            </p>

        </div>

    </section>

</main>


<script src="../js/notifications.js"></script>

<script src="../js/api.js"></script>

<script src="../js/manage-chapter-content.js"></script>

</body>

</html>
