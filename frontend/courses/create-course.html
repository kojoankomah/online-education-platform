<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Course</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/form.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-back-btn"
        >
            ← Back to Dashboard
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1>
                Create Course
            </h1>

            <p>
                Create a new course and provide the basic information
                students will see before enrolling.
            </p>

        </div>


        <div class="card">

            <form id="courseForm">

                <div class="form-group">

                    <label for="title">
                        Course Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="6"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="courseImage">
                        Course Thumbnail
                    </label>

                    <input
                        type="file"
                        id="courseImage"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <small>
                        JPG, PNG or WEBP. Maximum size: 5 MB.
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Course
                </button>

            </form>

        </div>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/create-course.js"></script>

</body>

</html>
