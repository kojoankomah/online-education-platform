<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Course</title>

<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/form.css">

</head>

<body>

<header class="dashboard-header">

<h2>
    <a href="../dashboard/instructor-dashboard.html">
        EduPlatform
    </a>
</h2>

<a href="../dashboard/instructor-dashboard.html">

Back to Dashboard

</a>

</header>

<main class="container">

        <div class="card">

        <h1>Create Course</h1>

        <form id="courseForm">

            <label for="title">
                Course Title
            </label>

            <input
                type="text"
                id="title"
                required
            >


            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                rows="6"
            ></textarea>


            <div class="form-group">

            <label for="courseImage">
                Course Thumbnail
            </label>

            <input
                type="file"
                id="courseImage"
                accept="image/jpeg,image/png,image/webp"
            >

            <small>
                JPG, PNG or WEBP. Maximum size: 5 MB.
            </small>

            </div>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Course
            </button>

        </form>

    </div>

</main>

<script src="../js/notifications.js"></script>

<script src="../js/api.js"></script>
<script src="../js/create-course.js"></script>


</body>

</html>
