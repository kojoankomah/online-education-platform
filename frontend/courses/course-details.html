<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Course Details</title>


<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/course.css">

</head>


<body>


<header class="dashboard-header">

<h2>
    <a href="../dashboard/student-dashboard.html">
        EduPlatform
    </a>
</h2>

<a href="../dashboard/student-dashboard.html">
Back to Dashboard
</a>

</header>



<main class="container">


<section class="card">


<h1 id="courseTitle">
Loading course...
</h1>


<p id="courseDescription">

</p>


</section>

<div class="progress-container">

    <h3>Course Progress</h3>

    <div class="progress-bar">
        <div id="courseProgressBar" class="progress"></div>
    </div>

    <p id="courseProgressText">
        Loading progress...
    </p>

</div>


<section
    id="continueLearningSection"
    class="card"
    style="display: none;"
>

    <h2>
        Continue Learning
    </h2>

    <p id="continueLearningText">
        Continue from where you left off.
    </p>

    <button
        type="button"
        id="continueLearningBtn"
        class="btn btn-primary"
    >
        Continue Learning
    </button>

</section>

<section class="card">


    <h2>
    Lessons
    </h2>


    <div id="lessonList">

        <p>
        Loading lessons...
        </p>

    </div>


</section>


</main>


<script src="../js/notifications.js"></script>

<script src="../js/api.js"></script>
<script src="../js/course.js"></script>


</body>

</html>
