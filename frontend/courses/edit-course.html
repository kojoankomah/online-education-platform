<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Edit Course</title>

<link
    rel="stylesheet"
    href="../css/global.css"
>

<link
    rel="stylesheet"
    href="../css/form.css"
>

</head>


<body>

<header class="dashboard-header">

<h2>
    <a href="../dashboard/instructor-dashboard.html">
        EduPlatform
    </a>
</h2>

<a
    id="backToCourse"
    href="#"
>
    Back to Course
</a>

</header>


<main class="dashboard-container">

<section class="card">

<h1>
    Edit Course
</h1>


<form id="editCourseForm">

<div class="form-group">

<label for="courseTitle">
    Course Title
</label>

<input
    type="text"
    id="courseTitle"
    required
>

</div>


<div class="form-group">

<label for="courseDescription">
    Course Description
</label>

<textarea
    id="courseDescription"
    rows="6"
></textarea>

</div>


<button
    type="submit"
    class="btn btn-primary"
>
    Save Changes
</button>

</form>

</section>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/edit-course.js"></script>

</body>

</html>
