<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Course</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/form.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            id="backToCourse"
            href="#"
            class="page-back-btn"
        >
            ← Back to Course
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1>
                Edit Course
            </h1>

            <p>
                Update the course information and replace the
                thumbnail if necessary.
            </p>

        </div>


        <div class="card">

            <form id="editCourseForm">

                <div class="form-group">

                    <label for="courseTitle">
                        Course Title
                    </label>

                    <input
                        type="text"
                        id="courseTitle"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="courseDescription">
                        Course Description
                    </label>

                    <textarea
                        id="courseDescription"
                        rows="6"
                    ></textarea>

                    <small>
                        Keep the description clear and focused on what
                        students will learn.
                    </small>

                </div>


                <div class="form-group">

                    <label>
                        Current Thumbnail
                    </label>

                    <div
                        id="currentThumbnail"
                        class="course-thumbnail-preview"
                    >
                        No thumbnail uploaded.
                    </div>

                </div>


                <div class="form-group">

                    <label for="courseImage">
                        Replace Thumbnail
                    </label>

                    <input
                        type="file"
                        id="courseImage"
                        accept="image/jpeg,image/png,image/webp"
                    >

                    <small>
                        JPG, PNG or WEBP. Maximum size: 5 MB.
                        Leave this empty to keep the current thumbnail.
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/edit-course.js"></script>

</body>

</html>
