<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Lesson</title>

<link rel="stylesheet"
href="../css/global.css">

</head>

<body>

<header class="dashboard-header">

<a href="javascript:history.back()">
    Back
</a>


<a id="backToCourse" href="#">
    Back
</a>

</header>

<main class="container">

<div class="card">

<h1>Add Lesson</h1>

<form id="lessonForm">

<label>

Lesson Title

</label>

<input
type="text"
id="title"
required>

<label>

Lesson Content

</label>

<textarea
id="content"
rows="10"
required>

</textarea>

<label>

Lesson Order

</label>

<input
    type="number"
    id="lessonOrder"
    min="1"
    step="1"
    required
>

<button
    type="submit"
    class="btn btn-primary"
>
    Create Lesson
</button>

</form>

</div>

</main>

<script src="../js/api.js"></script>
<script src="../js/add-lesson.js"></script>

</body>

</html>
