<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Lesson</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/form.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            id="backToCourse"
            href="#"
            class="page-back-btn"
        >
            ← Back to Course
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1>
                Add Lesson
            </h1>

            <p>
                Add a new lesson to the course and choose where it
                should appear in the learning sequence.
            </p>

        </div>


        <div class="card">

            <form id="lessonForm">

                <div class="form-group">

                    <label for="title">
                        Lesson Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="content">
                        Lesson Content (Optional)
                    </label>

                    <textarea
                        id="content"
                        rows="10"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="lessonOrder">
                        Lesson Order
                    </label>

                    <input
                        type="number"
                        id="lessonOrder"
                        min="1"
                        step="1"
                        required
                    >

                    <small>
                        Enter the position of this lesson within the course.
                    </small>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Create Lesson
                </button>

            </form>

        </div>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/add-lesson.js"></script>

</body>

</html>
