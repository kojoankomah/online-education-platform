<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Manage Chapters</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/dashboard.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/instructor-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            href="#"
            id="backToCourseBtn"
            class="page-back-btn"
        >
            ← Back to Course
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1 id="lessonTitle">
                Loading lesson...
            </h1>

            <p>
                Create, edit, reorder, and manage the chapters
                that make up this lesson.
            </p>

        </div>


        <section class="card course-actions">

            <button
                type="button"
                id="addChapterBtn"
                class="btn btn-primary"
            >
                + Add Chapter
            </button>

        </section>


        <section class="card">

            <h2>
                Chapters
            </h2>

            <div id="chapterList">

                <p>
                    Loading chapters...
                </p>

            </div>

        </section>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/manage-chapters.js"></script>

</body>

</html>
