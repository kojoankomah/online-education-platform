<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Manage Chapters</title>

<link
    rel="stylesheet"
    href="../css/global.css"
>

<link
    rel="stylesheet"
    href="../css/dashboard.css"
>

</head>

<body>

<header class="dashboard-header">

    <h2>
        <a href="../dashboard/instructor-dashboard.html">
            EduPlatform
        </a>
    </h2>

    <a
        href="#"
        id="backToCourseBtn"
    >
        Back to Course
    </a>

</header>


<main class="dashboard-container">

    <section class="welcome-card">

        <h1 id="lessonTitle">
            Loading lesson...
        </h1>

        <p>
            Create, edit, reorder, and manage
            chapters for this lesson.
        </p>

    </section>


    <section class="card course-actions">

        <button
            type="button"
            id="addChapterBtn"
            class="btn btn-primary"
        >
            + Add Chapter
        </button>

    </section>


    <section class="card">

        <h2>
            Chapters
        </h2>

        <div id="chapterList">

            <p>
                Loading chapters...
            </p>

        </div>

    </section>

</main>


<script src="../js/notifications.js"></script>

<script src="../js/api.js"></script>

<script src="../js/manage-chapters.js"></script>

</body>

</html>
