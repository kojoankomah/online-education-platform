<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Edit Chapter Content</title>

<link
    rel="stylesheet"
    href="../css/global.css"
>

</head>

<body>

<header class="dashboard-header">

    <a href="javascript:history.back()">
        Back
    </a>

    <a
        id="backToContent"
        href="#"
    >
        Back to Content
    </a>

</header>


<main class="container">

<div class="card">

    <h1>
        Edit Chapter Content
    </h1>


    <form id="contentForm">

        <label for="blockType">
            Content Type
        </label>

        <select
            id="blockType"
            required
        >

            <option value="text">
                Text
            </option>

            <option value="video">
                Video
            </option>

            <option value="image">
                Image
            </option>

            <option value="resource">
                Resource
            </option>

        </select>


        <div id="textField">

            <label for="textContent">
                Text Content
            </label>

            <textarea
                id="textContent"
                rows="10"
            ></textarea>

        </div>


        <div
            id="mediaField"
            style="display: none;"
        >

            <label for="mediaUrl">
                Media URL
            </label>

            <input
                type="url"
                id="mediaUrl"
            >

        </div>


        <label for="blockOrder">
            Block Order
        </label>

        <input
            type="number"
            id="blockOrder"
            min="1"
            step="1"
            required
        >


        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Changes
        </button>

    </form>

</div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/edit-chapter-content.js"></script>

</body>

</html>
