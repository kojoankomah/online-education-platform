<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Chapter</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/lesson.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/student-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            id="backToLesson"
            href="#"
            class="page-back-btn"
        >
            ← Back to Lesson
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1 id="chapterTitle">
                Loading chapter...
            </h1>

            <p id="chapterDescription">
            </p>

            <p id="chapterMeta">
            </p>

        </div>


        <section class="card">

            <h2>
                Chapter Content
            </h2>

            <div id="contentList">

                <p>
                    Loading content...
                </p>

            </div>

        </section>


        <section class="card">

            <button
                type="button"
                id="completeChapterBtn"
                class="btn btn-primary"
                disabled
            >
                Loading...
            </button>


            <div class="chapter-navigation">

                <button
                    type="button"
                    id="previousChapterBtn"
                    class="btn btn-secondary"
                    style="display: none;"
                >
                    ← Previous Chapter
                </button>

                <button
                    type="button"
                    id="nextChapterBtn"
                    class="btn btn-primary"
                    style="display: none;"
                >
                    Next Chapter →
                </button>

            </div>

        </section>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/chapter.js"></script>

</body>

</html>
