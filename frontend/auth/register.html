<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | EduPlatform</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">

</head>

<body class="auth-page">

<div class="auth-container">


<div class="auth-image">

<img 
src="../assets/images/register-illustration.png"
alt="Online learning">

</div>

<div class="auth-card">


<div class="auth-logo">

EduPlatform

</div>



<h1>
Create Account
</h1>


<p class="subtitle">
Start your learning journey
</p>



<form id="registerForm">



<div class="form-group">

<label>
Full Name
</label>

<input
type="text"
id="name"
placeholder="Enter name"
required>

</div>




<div class="form-group">

<label>
Email
</label>

<input
type="email"
id="email"
placeholder="Enter email"
required>

</div>




<div class="form-group">

<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Create password"
required>

</div>




<div class="form-group">

<label>
Account Type
</label>


<select id="role">


<option value="student">
Student
</option>


<option value="instructor">
Instructor
</option>


</select>


</div>




<button class="btn">

Register

</button>



</form>



<div class="auth-link">

Already have an account?

<a href="login.html">
Login
</a>


</div>



</div>


<script src="../js/api.js"></script>

<script src="../js/auth.js"></script>


</body>
</html>
