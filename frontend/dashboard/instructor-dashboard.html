<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Instructor Dashboard</title>

<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/dashboard.css">

</head>

<body>

<header class="dashboard-header">

<h2>
    <a href="instructor-dashboard.html">
        EduPlatform
    </a>
</h2>

<button
    type="button"
    id="logoutBtn"
    class="btn btn-danger"
>
    Logout
</button>

</header>

<main class="dashboard-container">

<section class="welcome-card">

<h1>

Welcome,

<span id="instructorName">
Instructor
</span>

</h1>

<p>

Manage your courses and students.

</p>

</section>

<section class="dashboard-grid">

<div class="dashboard-card">

<h3>
Courses Created
</h3>

<p id="courseCount">
0
</p>

</div>

<div class="dashboard-card">

<h3>
Total Students
</h3>

<p id="studentCount">
0
</p>

</div>

</section>

<section class="card">

<button
    type="button"
    class="btn btn-primary"
    onclick="window.location.href='../courses/create-course.html'"
>
    + Create New Course
</button>

</section>


<section class="card">

<h2>
My Courses
</h2>

<div id="courseList">
</div>

</section>

</main>

<script src="../js/api.js"></script>
<script src="../js/instructor-dashboard.js"></script>
<script src="../js/notifications.js"></script>


</body>

</html>
