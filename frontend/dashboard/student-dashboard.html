<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>


    <link rel="stylesheet"
          href="../css/global.css">

    <link rel="stylesheet"
          href="../css/dashboard.css">

</head>


<body>


<header class="dashboard-header">

    <h2>
        EduPlatform
    </h2>

    <a href="../courses/courses.html">
         Browse Courses
    </a>

    <button id="logoutBtn">
        Logout
    </button>

</header>



<main class="dashboard-container">


    <section class="welcome-card">


        <h1>
            Welcome,
            <span id="studentName">
            Student
            </span>
        </h1>


        <p>
            Continue your learning journey.
        </p>


    </section>



    <section class="dashboard-grid">


        <div class="dashboard-card">


            <h3>
                Enrolled Courses
            </h3>


            <p id="courseCount">
                0
            </p>


        </div>




        <div class="dashboard-card">


            <h3>
                Completed Lessons
            </h3>


            <p id="lessonCount">
                0
            </p>


        </div>




        <div class="dashboard-card">


            <h3>
                Quiz Attempts
            </h3>


            <p id="quizCount">
                0
            </p>


        </div>


    </section>

    <section class="card">

        <h2>My Courses</h2>

        <div id="courseList">

            <p>No enrolled courses.</p>

        </div>

    </section>
        <section class="card">

        <h2>
            Recent Quiz Attempts
        </h2>


        <div id="quizHistory">

            <p>
                No quiz attempts yet.
            </p>

        </div>


    </section>

</main>


<script src="../js/api.js"></script>

<script src="../js/dashboard.js"></script>


</body>

</html>
