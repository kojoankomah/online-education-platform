<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>


    <link rel="stylesheet"
          href="../css/global.css">

    <link rel="stylesheet"
          href="../css/dashboard.css">

</head>


<body>


<div class="dashboard-layout">


    <!-- SIDEBAR -->

    <aside class="sidebar">


        <h2>
            EduPlatform
        </h2>


        <nav>


            <a href="student-dashboard.html">
                🏠 Dashboard
            </a>


            <a href="../courses/courses.html">
                📚 Courses
            </a>


            <a href="#">
                📊 Progress
            </a>


            <a href="#">
                📝 Quiz History
            </a>


        </nav>


        <button id="logoutBtn">
            Logout
        </button>


    </aside>




    <!-- MAIN CONTENT -->

    <main class="dashboard-content">


        <header class="dashboard-header">


            <h2>
                Welcome,
                <span id="studentName">
                Student
                </span>
            </h2>


        </header>





        <!-- Statistics -->


        <section class="dashboard-grid">


            <div class="dashboard-card">

                <h3>
                    Courses
                </h3>

                <p id="courseCount">
                    0
                </p>

            </div>



            <div class="dashboard-card">

                <h3>
                    Lessons Completed
                </h3>

                <p id="lessonCount">
                    0
                </p>

            </div>




            <div class="dashboard-card">

                <h3>
                    Quiz Attempts
                </h3>

                <p id="quizCount">
                    0
                </p>

            </div>


        </section>





        <!-- COURSES -->

        <section class="dashboard-section">


            <h2>
                My Courses
            </h2>


            <div id="courseList">


            </div>


        </section>





        <!-- QUIZ HISTORY -->


        <section class="dashboard-section">


            <h2>
                Quiz History
            </h2>


            <div id="quizHistory">


            </div>


        </section>



    </main>



</div>





<script src="../js/api.js"></script>

<script src="../js/dashboard.js"></script>


</body>
</html>
