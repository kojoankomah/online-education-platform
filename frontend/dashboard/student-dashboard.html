<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>


    <link rel="stylesheet"
          href="../css/global.css">

    <link rel="stylesheet"
          href="../css/dashboard.css">

</head>


<body>


<div class="dashboard-layout">

    <!-- MOBILE DASHBOARD HEADER -->

    <header class="dashboard-mobile-header">

        <button
            type="button"
            class="sidebar-toggle"
            id="sidebarToggle"
            aria-label="Open dashboard menu"
            aria-expanded="false"
            aria-controls="studentSidebar"
        >

            <span></span>
            <span></span>
            <span></span>

        </button>


        <a
            href="student-dashboard.html"
            class="mobile-dashboard-logo"
        >
            EduPlatform
        </a>

    </header>


    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>

    <!-- SIDEBAR -->

    <aside
        class="sidebar"
        id="studentSidebar"
    >

        <div class="sidebar-heading">

            <h2>
                EduPlatform
            </h2>


            <button
                type="button"
                class="sidebar-close"
                id="sidebarClose"
                aria-label="Close dashboard menu"
            >
                &times;
            </button>

        </div>


        <nav>

            <a
                href="#dashboardTop"
                class="sidebar-link active"
                data-section="dashboardTop"
                aria-current="location"
            >
                🏠 Dashboard
            </a>

            <a
                href="../courses/courses.html"
                class="sidebar-link"
            >
                📚 Courses
            </a>

            <a
                href="#progressSection"
                class="sidebar-link"
                data-section="progressSection"
            >
                📊 Progress
            </a>

            <a
                href="#quizHistorySection"
                class="sidebar-link"
                data-section="quizHistorySection"
            >
                📝 Quiz History
            </a>

        </nav>


        <button id="logoutBtn" type="button" class="btn btn-danger">
            Logout
        </button>


    </aside>




    <!-- MAIN CONTENT -->

    <main
        class="dashboard-content"
        id="dashboardTop"
    >

        <header class="dashboard-header">


            <h2>
                Welcome,
                <span id="studentName">
                Student
                </span>
            </h2>


        </header>





        <!-- Statistics -->


        <section class="dashboard-grid">


            <div class="dashboard-card">

                <h3>
                    Courses
                </h3>

                <p id="courseCount">
                    0
                </p>

            </div>



            <div class="dashboard-card">

                <h3>
                    Lessons Completed
                </h3>

                <p id="lessonCount">
                    0
                </p>

            </div>




            <div class="dashboard-card">

                <h3>
                    Quiz Attempts
                </h3>

                <p id="quizCount">
                    0
                </p>

            </div>


        </section>





        <!-- COURSES -->

            <section class="dashboard-section"  id="progressSection">

            <h2>
                My Courses & Progress
            </h2>


            <div id="courseList">


            </div>


        </section>





        <!-- QUIZ HISTORY -->


        <section class="dashboard-section" id="quizHistorySection">


            <h2>
                Quiz History
            </h2>


            <div id="quizHistory">


            </div>


        </section>



    </main>



</div>





<script src="../js/api.js"></script>

<script src="../js/dashboard.js"></script>

<script src="../js/navigation.js"></script>
</body>
</html>
