<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lesson</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/lesson.css"
    >

</head>

<body>

<header class="page-header">

    <div class="container page-header-inner">

        <a
            href="../dashboard/student-dashboard.html"
            class="page-brand"
        >
            EduPlatform
        </a>

        <a
            id="backToCourse"
            href="#"
            class="page-back-btn"
        >
            ← Back to Course
        </a>

    </div>

</header>


<main class="app-page">

    <div class="container">

        <div class="app-page-title">

            <h1 id="lessonTitle">
                Loading lesson...
            </h1>

            <p id="lessonContent">
            </p>

        </div>


        <section
            id="chapterSection"
            class="card"
            style="display: none;"
        >

            <div class="lesson-section-heading">

                <div>

                    <h2>
                        Chapters
                    </h2>

                    <p>
                        Complete the learning chapters in order
                        before finishing this lesson.
                    </p>

                </div>

                <p
                    id="chapterProgress"
                    class="lesson-progress-text"
                >
                </p>

            </div>


            <div id="chapterList">
            </div>

        </section>


        <section class="card">

            <h2>
                Lesson Actions
            </h2>

            <p>
                Take the lesson quiz after studying the chapters,
                then complete the lesson when all requirements are met.
            </p>


            <div class="course-actions">

                <button
                    type="button"
                    id="quizBtn"
                    class="btn btn-primary"
                >
                    Take Quiz
                </button>

                <button
                    type="button"
                    id="completeBtn"
                    class="btn btn-secondary"
                >
                    Mark Lesson Complete
                </button>

            </div>

        </section>

    </div>

</main>


<script src="../js/notifications.js"></script>
<script src="../js/api.js"></script>
<script src="../js/lesson.js"></script>

</body>

</html>
